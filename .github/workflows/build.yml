name: Build and Push Container Image

on:
  push:
    branches:
      - main
      - carlos
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - carlos

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests

      - name: Run tests
        run: ./mvnw -B test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push container image
        run: |
          # IMAGE_NAME is already "owner/repo" (github.repository), so no
          # separate --group is needed - passing both doubled the path into
          # ghcr.io/<owner>/<owner>/<repo>.
          #
          # Tag primarily with the full commit SHA (guaranteed unique and
          # immutable, unlike a branch name or "latest") so deployments can
          # pin to an exact, traceable build. The other tags computed by
          # docker/metadata-action (branch name, latest, short-sha) are kept
          # as additional convenience tags on the same image.
          ADDITIONAL_TAGS=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.["tag-names"] | join(",")')
          ./mvnw -B package \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=${{ env.REGISTRY }} \
            -Dquarkus.container-image.name=${{ env.IMAGE_NAME }} \
            -Dquarkus.container-image.tag=${{ github.sha }} \
            -Dquarkus.container-image.additional-tags=${ADDITIONAL_TAGS} \
            -DskipTests

